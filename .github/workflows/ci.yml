# Compila y prueba en Windows, Linux y macOS en cada push y pull request.
# macOS es experimental: todavia no se probo en una Mac, asi que si falla
# se ve en su trabajo pero no marca como fallida toda la ejecucion.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        experimental: [false]
        include:
          # Apple Silicon (M1 y posteriores).
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev libgtk-3-dev \
            libudev-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shm0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Pruebas
        run: cargo test --locked

      - name: Compilacion de release
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      # En macOS se arma la app completa (las dos arquitecturas, el paquete
      # .app, la firma ad hoc y el .zip), para saber en cada cambio que el
      # release va a poder generarla.
      - name: Empaquetado de la app (macOS)
        if: runner.os == 'macOS'
        run: sh recursos/macos/empaquetar.sh
