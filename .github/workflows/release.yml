# Al subir una etiqueta vX.Y.Z, compila para Windows y Linux y publica un
# release con el ejecutable, los manuales en PDF (español e inglés), las
# licencias y los README.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  compilar:
    name: Compilar (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            paquete: MCPRaptorPlayer-windows-x64
          - os: ubuntu-latest
            paquete: MCPRaptorPlayer-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libfontconfig1-dev libgtk-3-dev \
            libudev-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shm0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Pruebas
        run: cargo test --locked

      - name: Compilar
        run: cargo build --release --locked

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destino = "${{ matrix.paquete }}"
          New-Item -ItemType Directory $destino | Out-Null
          Copy-Item target/release/mcp-raptor-player.exe "$destino/MCPRaptorPlayer.exe"
          Copy-Item docs/manual/Raptor_Manual_es.pdf, docs/manual/Raptor_Manual_en.pdf, LICENSE, ASSETS-LICENSES.md, README.md, README.es.md $destino
          Compress-Archive -Path "$destino/*" -DestinationPath "$destino.zip"

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          destino="${{ matrix.paquete }}"
          mkdir -p "$destino/recursos/linux" "$destino/target/release" "$destino/ui/iconos"
          cp target/release/mcp-raptor-player "$destino/target/release/"
          cp recursos/linux/* "$destino/recursos/linux/"
          cp ui/iconos/ventana-raptor.svg "$destino/ui/iconos/"
          cp docs/manual/Raptor_Manual_es.pdf docs/manual/Raptor_Manual_en.pdf LICENSE ASSETS-LICENSES.md README.md README.es.md "$destino/"
          tar -czf "$destino.tar.gz" "$destino"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.paquete }}
          path: |
            ${{ matrix.paquete }}.zip
            ${{ matrix.paquete }}.tar.gz
          if-no-files-found: error

  publicar:
    name: Publicar el release
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
